services:
    postgres:
        image: pgvector/pgvector:pg16
        container_name: rosetta_Postgres
        environment:
            POSTGRES_USER: rosetta
            POSTGRES_PASSWORD: rosetta_Dev_Password
            POSTGRES_DB: rosetta_DB
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U rosetta -d rosetta_DB"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: rosetta_Redis
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5
    minio:
        image:  minio/minio:RELEASE.2024-01-16T16-07-38Z
        container_name: rosetta_Minio
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        command: server /data --console-address ":9001"
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
            interval: 1m30s
            timeout: 30s
            retries: 5
            start_period: 30s
volumes:
    postgres_data:
    redis_data:
    minio_data:

